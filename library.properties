sentence=Update ESP32 / ESP8266 firmware from a web browser over Wi-Fi: password, file and chip checks, clear tips (ru/kk/en).
paragraph=Adds a firmware update page to ESP32 and ESP8266 in three lines. Open the page on a phone or computer, choose the .bin file and the board updates itself. A password is required, the file type and the target chip are checked before writing so a wrong file cannot break the board, and a failed upload leaves the old firmware running. Works with your own web server or alone. Explains problems in Russian, Kazakh or English. Needs only the built-in WebServer and Update. Made for classes and kits by Alash Electronics.
